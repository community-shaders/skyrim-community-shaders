name: "(Shared) Build and Validate"

on:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to check out"
                type: string
                required: true
            repository:
                description: "Repository to check out (owner/repo)"
                type: string
                required: true
            run-cpp:
                description: "Run C++ plugin build"
                type: boolean
                default: true
            run-shader-validation:
                description: "Run HLSL shader compilation validation"
                type: boolean
                default: true
            hlsl-should-build:
                description: "Passed to check-hlsl-changes; 'true' forces shader steps to run"
                type: string
                default: "true"
            cache-key-suffix:
                description: "Optional suffix to invalidate the build cache"
                type: string
                default: ""
            cmake-preset:
                description: "CMake configure/build preset for the C++ build (ALL = full LTCG shipping flags; PR = mild optimization without LTCG or full debug info)"
                type: string
                default: "ALL"
        outputs:
            version:
                description: "CMake project version extracted from the build"
                value: ${{ jobs.cpp-build.outputs.version }}
            cpp-built:
                description: "'true' if the C++ build job ran and succeeded"
                value: ${{ jobs.cpp-build.result == 'success' }}

jobs:
    cpp-build:
        name: Build plugin and addons (${{ matrix.compiler.name }})
        if: inputs.run-cpp
        runs-on: windows-2025
        permissions:
            contents: read
        outputs:
            version: ${{ steps.get_version.outputs.version }}
        strategy:
            matrix:
                compiler:
                    - name: vs2026
                      cmake-preset: ${{ inputs.cmake-preset }}
                      build-dir: build/${{ inputs.cmake-preset }}
            fail-fast: false
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  submodules: recursive
                  persist-credentials: false
                  allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

            - name: Fetch Streamline LFS assets
              shell: pwsh
              run: git -C extern/Streamline lfs pull

            - name: Setup Build Environment
              id: setup
              uses: ./.github/actions/setup-build-environment
              with:
                  cache-key-suffix: "cpp-${{ matrix.compiler.name }}${{ inputs.cache-key-suffix }}"
                  cmake-preset: ${{ matrix.compiler.cmake-preset }}
                  build-dir: ${{ matrix.compiler.build-dir }}

            # Build Streamline plugins before CMake discovers staging inputs.
            - name: Build Streamline fork plugins
              shell: pwsh
              run: |
                  ./tools/build-streamline.ps1 -Required
                  if ($LASTEXITCODE -ne 0) {
                    throw "Streamline fork build failed with exit code $LASTEXITCODE"
                  }

                  $artifacts = 'extern/Streamline/_artifacts'
                  $required = @('sl.interposer', 'sl.fsr', 'sl.fsr_g', 'sl.xess')
                  $missing = @($required | Where-Object {
                    -not (Test-Path (Join-Path $artifacts "$_/Develop_x64/$_.dll"))
                  })
                  if ($missing.Count -ne 0) {
                    throw "Streamline build did not produce: $($missing -join ', ')"
                  }

            - name: Resolve DXVK submodule SHA
              id: dxvk_sha
              shell: bash
              run: echo "sha=$(git -C extern/dxvk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # Keep trusted-saved caches in a versioned namespace so entries
            # written before the restore-only policy cannot be reused.
            - name: Restore DXVK build cache
              id: cache_dxvk
              uses: actions/cache/restore@v5
              with:
                  path: extern/dxvk/build
                  key: ${{ runner.os }}-dxvk-trusted-v1-avxndebug-vksdk-${{ steps.dxvk_sha.outputs.sha }}

            - name: Install DXVK build tools (meson and ninja)
              if: steps.cache_dxvk.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  python -m pip install --upgrade meson ninja

            - name: Build DXVK
              if: steps.cache_dxvk.outputs.cache-hit != 'true'
              shell: pwsh
              # Match the local release flags and build only staged APIs.
              run: |
                  meson setup extern/dxvk/build extern/dxvk --buildtype release -Db_ndebug=true -Dcpp_args="/arch:AVX" -Denable_d3d8=false -Denable_d3d9=false -Denable_d3d10=false
                  ninja -C extern/dxvk/build

            - name: Save DXVK build cache (trusted events only)
              if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.cache_dxvk.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: extern/dxvk/build
                  key: ${{ runner.os }}-dxvk-trusted-v1-avxndebug-vksdk-${{ steps.dxvk_sha.outputs.sha }}

            - name: Build using run-cmake
              uses: lukka/run-cmake@v10
              with:
                  configurePreset: ${{ matrix.compiler.cmake-preset }}
                  buildPreset: ${{ matrix.compiler.cmake-preset }}

            - name: Verify packaged Vulkan runtimes
              shell: pwsh
              run: |
                  $aioDir = '${{ matrix.compiler.build-dir }}/aio'
                  $runtimeDir = Join-Path $aioDir 'SKSE/Plugins/CommunityShaders/bin'
                  $required = @(
                    'amd_fidelityfx_vk.dll',
                    'dxvk_d3d11.dll',
                    'dxvk_dxgi.dll',
                    'dxvk.license.txt',
                    'fidelityfx.license.txt',
                    'libxess.dll',
                    'license.txt',
                    'NvLowLatencyVk.dll',
                    'nvngx_dlss.dll',
                    'nvngx_dlss.license.txt',
                    'nvngx_dlssg.dll',
                    'reflex.license.txt',
                    'sl.common.dll',
                    'sl.dlss.dll',
                    'sl.dlss_g.dll',
                    'sl.fsr.dll',
                    'sl.fsr_g.dll',
                    'sl.interposer.dll',
                    'sl.pcl.dll',
                    'sl.reflex.dll',
                    'sl.xess.dll',
                    'xess.license.txt',
                    'xess.third-party-programs.txt'
                  )
                  $missing = @($required | Where-Object {
                    -not (Test-Path (Join-Path $runtimeDir $_) -PathType Leaf)
                  })
                  if ($missing.Count -ne 0) {
                    throw "AIO is missing required Vulkan runtimes: $($missing -join ', ')"
                  }

                  $legacy = @(Get-ChildItem -LiteralPath $aioDir -Recurse -File | Where-Object {
                    $_.Name -match '(?i)(dx12|d3d12)'
                  })
                  if ($legacy.Count -ne 0) {
                    throw "AIO contains legacy DX12 runtimes: $($legacy.FullName -join ', ')"
                  }

                  $archives = @(Get-ChildItem -LiteralPath dist -File | Where-Object {
                    $_.Name -match '^CommunityShaders_AIO-.*\.(7z|zip)$'
                  })
                  if ($archives.Count -eq 0) {
                    throw 'Build did not produce an AIO archive'
                  }
                  $oversized = @($archives | Where-Object { $_.Length -ge 100000000 })
                  if ($oversized.Count -ne 0) {
                    throw "AIO archive must be under 100 MB: $($oversized.Name -join ', ')"
                  }

            - name: Extract version from CMake
              id: get_version
              shell: pwsh
              run: |
                  $content = Get-Content ${{ matrix.compiler.build-dir }}/CMakeCache.txt
                  $versionLine = $content | Select-String -Pattern 'CMAKE_PROJECT_VERSION:STATIC'
                  if ($versionLine) {
                      $version = ($versionLine -replace '.*=([0-9]+\.[0-9]+\.[0-9]+).*', '$1').ToString()
                  } else {
                      Write-Error "Version extraction failed: CMAKE_PROJECT_VERSION not found in CMakeCache.txt" -ErrorAction Stop
                  }
                  if (-not $version -or $version -eq "") {
                      Write-Error "Version extraction failed: no version found" -ErrorAction Stop
                  }
                  "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            - name: Fail if CMake version does not match tag
              if: success() && github.ref_type == 'tag'
              shell: pwsh
              run: |
                  $tag = '${{ github.ref_name }}'
                  $expected = ($tag -replace '^v([0-9]+\.[0-9]+\.[0-9]+).*', '$1')
                  $version = '${{ steps.get_version.outputs.version }}'
                  if (-not $version -or $version -eq "") {
                    Write-Error "Version extraction failed: no version found in previous step" -ErrorAction Stop
                  }
                  if ($version -ne $expected) {
                    Write-Error "CMakeLists.txt version '$version' does not match tag version '$expected'. Please update CMakeLists.txt before tagging." -ErrorAction Stop
                  } else {
                    Write-Host "CMakeLists.txt version matches tag."
                  }

            - name: Upload dist artifacts
              if: success() && matrix.compiler.name == 'vs2026'
              uses: actions/upload-artifact@v7
              with:
                  name: dist-artifacts
                  path: dist/
                  retention-days: 30

    shader-validation:
        if: inputs.run-shader-validation
        name: Validate shader compilation
        runs-on: windows-2025
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  submodules: recursive
                  persist-credentials: false
                  allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

            - name: Fetch Streamline LFS assets
              shell: pwsh
              run: git -C extern/Streamline lfs pull

            - name: Check for HLSL Changes
              id: check-hlsl
              uses: ./.github/actions/check-hlsl-changes
              with:
                  hlsl-should-build: ${{ inputs.hlsl-should-build }}
            - name: Setup Build Environment
              id: setup
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: ./.github/actions/setup-build-environment
              with:
                  cache-key-suffix: "validation${{ inputs.cache-key-suffix }}"
            - name: Prepare shaders
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: ./.github/actions/prepare-shaders
            - name: Locate fxc.exe
              if: steps.check-hlsl.outputs.skip != 'true'
              id: find_fxc
              shell: pwsh
              run: |
                  $fxcCmd = Get-Command -Name fxc.exe -ErrorAction SilentlyContinue
                  if ($fxcCmd) {
                    $fxcPath = $fxcCmd.Source
                    Write-Host "Found fxc.exe at $fxcPath"
                    Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path=$fxcPath"
                  } else {
                    $fxcPath = ''
                    $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
                    if (Test-Path $sdkRoot) {
                      $versions = Get-ChildItem -Path $sdkRoot -Directory | Sort-Object -Descending
                      foreach ($v in $versions) {
                        $candidate = Join-Path $v.FullName 'x64\fxc.exe'
                        if (Test-Path $candidate) { $fxcPath = $candidate; break }
                      }
                    }
                    if ($fxcPath -ne '') {
                      Write-Host "Found fxc.exe at $fxcPath"
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path=$fxcPath"
                    } else {
                      Write-Warning "fxc.exe not found in PATH or common SDK locations"
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path="
                    }
                  }

            # --shader-dir stays on build/ALL: prepare-shaders always populates
            # the ALL preset; inputs.cmake-preset only selects the C++ tier.
            - name: Validate shader compilation
              if: steps.check-hlsl.outputs.skip != 'true'
              shell: bash
              run: |
                  if [ -z "${{ steps.find_fxc.outputs.fxc_path }}" ]; then
                    echo "fxc.exe not found - shader validation requires fxc.exe. Set --fxc to a valid path or ensure fxc.exe is in PATH." >&2
                    exit 1
                  fi
                  hlslkit-compile --fxc "${{ steps.find_fxc.outputs.fxc_path }}" --shader-dir build/ALL/aio/Shaders --output-dir build/ShaderCache --config .github/configs/shader-validation.yaml --max-warnings 0 --suppress-warnings X1519

            - name: Upload shader validation logs
              if: failure() && steps.check-hlsl.outputs.skip != 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: shader-validation-logs
                  path: |
                      build/ShaderCache/new_issues.log
                      build/ShaderCache/*.log
                  retention-days: 7
                  if-no-files-found: ignore
