name: "(Shared) Build and Validate"

on:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to check out"
                type: string
                required: true
            repository:
                description: "Repository to check out (owner/repo)"
                type: string
                required: true
            run-cpp:
                description: "Run C++ plugin build"
                type: boolean
                default: true
            run-shader-validation:
                description: "Run HLSL shader compilation validation"
                type: boolean
                default: true
            run-shader-tests:
                description: "Run shader unit tests"
                type: boolean
                default: true
            hlsl-should-build:
                description: "Passed to check-hlsl-changes; 'true' forces shader steps to run"
                type: string
                default: "true"
            shader-tests-should-build:
                description: "Passed to check-hlsl-changes for unit tests"
                type: string
                default: "true"
            cache-key-suffix:
                description: "Optional suffix to invalidate the build cache"
                type: string
                default: ""
            changed-files-json:
                description: "JSON array of changed paths for incremental shader validation; empty => full validation"
                type: string
                default: ""
        outputs:
            version:
                description: "CMake project version extracted from the build"
                value: ${{ jobs.cpp-build.outputs.version }}
            cpp-built:
                description: "'true' if the C++ build job ran and succeeded"
                value: ${{ jobs.cpp-build.result == 'success' }}

jobs:
    cpp-build:
        name: Build plugin and addons (${{ matrix.compiler.name }})
        if: inputs.run-cpp
        runs-on: windows-2025
        permissions:
            contents: read
        outputs:
            version: ${{ steps.get_version.outputs.version }}
        strategy:
            matrix:
                compiler:
                    - name: vs2026
                      cmake-preset: ALL
                      build-dir: build/ALL
            fail-fast: false
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  submodules: recursive
                  persist-credentials: false

            - name: Setup Build Environment
              id: setup
              uses: ./.github/actions/setup-build-environment
              with:
                  cache-key-suffix: "cpp-${{ matrix.compiler.name }}${{ inputs.cache-key-suffix }}"
                  cmake-preset: ${{ matrix.compiler.cmake-preset }}
                  build-dir: ${{ matrix.compiler.build-dir }}

            - name: Build using run-cmake
              uses: lukka/run-cmake@v10
              with:
                  configurePreset: ${{ matrix.compiler.cmake-preset }}
                  configurePresetAdditionalArgs: "['-DBUILD_SHADER_TESTS=OFF', '-DBUILD_CONTROLLER_TESTS=ON']"
                  buildPreset: ${{ matrix.compiler.cmake-preset }}

            - name: Build controller tests
              run: |
                  cmake --build ${{ matrix.compiler.build-dir }} --config Release --target controller_tests

            - name: Run controller tests
              run: |
                  # Unfiltered on purpose. This step previously carried
                  # -R "PerfModeRestartState|VRVendorRelatchPolicy|FSRHostLifecyclePolicy",
                  # a hand-maintained list that silently excluded every test added
                  # after it was written - OverlayPolicy, VRGeometryPolicy,
                  # VRGeometrySpaces and VRPipelineContract. The compile-time
                  # assertions in those still ran, because building them IS running
                  # them, but their runtime main() never executed once.
                  #
                  # The configure preset above sets BUILD_SHADER_TESTS=OFF, so this
                  # build directory registers controller tests only. --no-tests=error
                  # keeps an empty set from passing silently.
                  ctest --test-dir ${{ matrix.compiler.build-dir }} -C Release --output-on-failure --no-tests=error --timeout 60

                  # Leave proof that this step actually executed. See the guard below.
                  echo "ran" > "${{ matrix.compiler.build-dir }}/controller-tests-ran.marker"

            - name: Assert the controller tests actually ran
              shell: pwsh
              run: |
                  # On 2026-08-26 this job reported SUCCESS while containing no
                  # controller test steps at all. The API step list went straight
                  # from "Build using run-cmake" to "Extract version from CMake" -
                  # seven steps where the previous run had nine. Both the base and
                  # head branches contained the steps; GitHub was in a Critical
                  # Actions outage and served a workflow that was not the one in the
                  # repository.
                  #
                  # No step can detect its own absence, so this cannot protect
                  # against a wholesale stale-workflow event - if the dispatcher
                  # drops steps it may drop this one too. What it does close is the
                  # ordinary case, which has already bitten this project twice: a
                  # hand-maintained ctest -R filter that silently excluded every
                  # newer test, and a controller_tests target whose DEPENDS list was
                  # missing a registration so ctest ran an executable that was never
                  # built.
                  #
                  # Three failures in one week of CI reporting success about
                  # something it did not measure is enough to make the absence
                  # itself a failure.
                  $marker = "${{ matrix.compiler.build-dir }}/controller-tests-ran.marker"
                  if (-not (Test-Path $marker)) {
                      Write-Host "::error::The controller test step did not run. This job may not have executed the workflow in the repository - check the job's step list against .github/workflows/_shared-build.yaml before trusting any result from it."
                      exit 1
                  }

                  # A positive count, not merely a non-empty run. --no-tests=error
                  # already rejects an empty set; this rejects a SHRUNKEN one, which
                  # is what a filter or a missing registration produces.
                  $out = ctest --test-dir "${{ matrix.compiler.build-dir }}" -C Release -N
                  $line = $out | Select-String -Pattern 'Total Tests:\s*(\d+)'
                  if (-not $line) {
                      Write-Host "::error::Could not read a test count from ctest -N."
                      exit 1
                  }
                  $count = [int]$line.Matches[0].Groups[1].Value
                  # Raise this when tests are added. It is a floor, deliberately -
                  # a number that only ever goes up is a number someone has to think
                  # about.
                  $minimum = 9
                  Write-Host "controller tests discovered: $count (minimum $minimum)"
                  if ($count -lt $minimum) {
                      Write-Host "::error::Expected at least $minimum controller tests, found $count. A test was dropped, filtered, or never registered."
                      exit 1
                  }

            - name: Extract version from CMake
              id: get_version
              shell: pwsh
              run: |
                  $content = Get-Content ${{ matrix.compiler.build-dir }}/CMakeCache.txt
                  $versionLine = $content | Select-String -Pattern 'CMAKE_PROJECT_VERSION:STATIC'
                  if ($versionLine) {
                      $version = ($versionLine -replace '.*=([0-9]+\.[0-9]+\.[0-9]+).*', '$1').ToString()
                  } else {
                      Write-Error "Version extraction failed: CMAKE_PROJECT_VERSION not found in CMakeCache.txt" -ErrorAction Stop
                  }
                  if (-not $version -or $version -eq "") {
                      Write-Error "Version extraction failed: no version found" -ErrorAction Stop
                  }
                  "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            - name: Fail if CMake version does not match tag
              if: success() && github.ref_type == 'tag'
              shell: pwsh
              run: |
                  $tag = '${{ github.ref_name }}'
                  $expected = ($tag -replace '^v([0-9]+\.[0-9]+\.[0-9]+).*', '$1')
                  $version = '${{ steps.get_version.outputs.version }}'
                  if (-not $version -or $version -eq "") {
                    Write-Error "Version extraction failed: no version found in previous step" -ErrorAction Stop
                  }
                  if ($version -ne $expected) {
                    Write-Error "CMakeLists.txt version '$version' does not match tag version '$expected'. Please update CMakeLists.txt before tagging." -ErrorAction Stop
                  } else {
                    Write-Host "CMakeLists.txt version matches tag."
                  }

            - name: Upload dist artifacts
              if: success() && matrix.compiler.name == 'vs2026'
              uses: actions/upload-artifact@v7
              with:
                  name: dist-artifacts
                  path: dist/
                  retention-days: 30

    shader-validation:
        if: inputs.run-shader-validation
        name: Validate shader compilation (${{ matrix.config.name }})
        runs-on: windows-2025
        permissions:
            contents: read
        strategy:
            matrix:
                config:
                    - name: "Flatrim"
                      file: ".github/configs/shader-validation.yaml"
                    - name: "VR"
                      file: ".github/configs/shader-validation-vr.yaml"
            fail-fast: false
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  submodules: recursive
                  persist-credentials: false

            - name: Check for HLSL Changes
              id: check-hlsl
              uses: ./.github/actions/check-hlsl-changes
              with:
                  hlsl-should-build: ${{ inputs.hlsl-should-build }}
            - name: Setup Build Environment
              id: setup
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: ./.github/actions/setup-build-environment
              with:
                  cache-key-suffix: "validation-${{ matrix.config.name }}${{ inputs.cache-key-suffix }}"
            - name: Prepare shaders
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: ./.github/actions/prepare-shaders
            - name: Locate fxc.exe
              if: steps.check-hlsl.outputs.skip != 'true'
              id: find_fxc
              shell: pwsh
              run: |
                  $fxcCmd = Get-Command -Name fxc.exe -ErrorAction SilentlyContinue
                  if ($fxcCmd) {
                    $fxcPath = $fxcCmd.Source
                    Write-Host "Found fxc.exe at $fxcPath"
                    Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path=$fxcPath"
                  } else {
                    $fxcPath = ''
                    $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
                    if (Test-Path $sdkRoot) {
                      $versions = Get-ChildItem -Path $sdkRoot -Directory | Sort-Object -Descending
                      foreach ($v in $versions) {
                        $candidate = Join-Path $v.FullName 'x64\fxc.exe'
                        if (Test-Path $candidate) { $fxcPath = $candidate; break }
                      }
                    }
                    if ($fxcPath -ne '') {
                      Write-Host "Found fxc.exe at $fxcPath"
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path=$fxcPath"
                    } else {
                      Write-Warning "fxc.exe not found in PATH or common SDK locations"
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "fxc_path="
                    }
                  }

            - name: Validate shader compilation (${{ matrix.config.name }})
              if: steps.check-hlsl.outputs.skip != 'true'
              shell: bash
              env:
                  CHANGED_FILES_JSON: ${{ inputs.changed-files-json }}
              run: |
                  if [ -z "${{ steps.find_fxc.outputs.fxc_path }}" ]; then
                    echo "fxc.exe not found - shader validation requires fxc.exe. Set --fxc to a valid path or ensure fxc.exe is in PATH." >&2
                    exit 1
                  fi
                  # Materialize the changed-file list, one path per line.
                  # Empty or absent JSON means an unknown change set, so the
                  # wrapper validates everything for push/release workflows.
                  # Malformed JSON also falls back to full validation.
                  : > changed_files.txt
                  if [ -n "$CHANGED_FILES_JSON" ]; then
                    if ! printf '%s' "$CHANGED_FILES_JSON" | jq -r '.[]' > changed_files.txt 2>/dev/null; then
                      echo "WARNING: could not parse changed-files JSON; running FULL validation."
                      : > changed_files.txt
                    fi
                  fi
                  echo "Changed files for incremental validation:"
                  cat changed_files.txt || true
                  python tools/validate_changed_shaders.py --changed-list-file changed_files.txt -- \
                    hlslkit-compile --fxc "${{ steps.find_fxc.outputs.fxc_path }}" --shader-dir build/ALL/aio/Shaders --output-dir build/ShaderCache --config ${{ matrix.config.file }} --max-warnings 0 --suppress-warnings X1519

            - name: Upload shader validation logs
              if: failure() && steps.check-hlsl.outputs.skip != 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: shader-validation-logs-${{ matrix.config.name }}
                  path: |
                      build/ShaderCache/new_issues.log
                      build/ShaderCache/*.log
                  retention-days: 7
                  if-no-files-found: ignore

    shader-unit-tests:
        name: Run Shader Unit Tests
        if: inputs.run-shader-tests
        runs-on: windows-2025
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  submodules: recursive
                  persist-credentials: false

            - name: Check for HLSL Changes
              id: check-hlsl
              uses: ./.github/actions/check-hlsl-changes
              with:
                  hlsl-should-build: ${{ inputs.shader-tests-should-build }}
            - name: Setup Build Environment
              id: setup
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: ./.github/actions/setup-build-environment
              with:
                  cache-key-suffix: "tests${{ inputs.cache-key-suffix }}"
                  cmake-preset: "ALL"
                  build-dir: "build/ALL"

            - name: Build shader tests
              if: steps.check-hlsl.outputs.skip != 'true'
              uses: lukka/run-cmake@v10
              with:
                  configurePreset: ALL
                  configurePresetAdditionalArgs: "['-DBUILD_SHADER_TESTS=ON']"
                  buildPreset: ALL
                  buildPresetAdditionalArgs: "['--target shader_tests']"

            - name: Run shader unit tests
              if: steps.check-hlsl.outputs.skip != 'true'
              run: |
                  ctest --test-dir build/ALL -C Release --output-on-failure -R ShaderTests --timeout 300

            - name: Upload test results on failure
              if: failure() && steps.check-hlsl.outputs.skip != 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: shader-test-results
                  path: |
                      build/ALL/Testing/**
                  retention-days: 7
                  if-no-files-found: ignore
